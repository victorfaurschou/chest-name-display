name: publish to curseforge
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      minecraft_version:
        required: true
        type: string
      build_run_id:
        required: true
        type: string
    secrets:
      CURSEFORGE_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: download artifacts
        uses: actions/download-artifact@v5
        with:
          name: Artifacts
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/libs

      - name: publish
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          VERSION: ${{ inputs.version }}
          MINECRAFT_VERSION: ${{ inputs.minecraft_version }}
          JAR: build/libs/storage-container-labels-${{ inputs.version }}.jar
        run: sh .github/workflows/scripts/curseforge.sh
